# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license

[package]
name = "ultralytics-template-rust"
version = "0.0.6"
edition = "2024"
rust-version = "1.91"
authors = [
    "Glenn Jocher <glenn.jocher@ultralytics.com>",
    "Onuralp Sezer <onuralp@ultralytics.com>",
]
license = "AGPL-3.0-or-later"
description = "Ultralytics Rust project template showcasing a minimal library and binary layout."
repository = "https://github.com/ultralytics/template-rust"
homepage = "https://www.ultralytics.com"
documentation = "https://docs.rs/ultralytics-template-rust"
readme = "README.md"
keywords = ["ultralytics", "template", "ml", "ai", "yolo"]
categories = ["development-tools", "science", "computer-vision"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/src/**/*.rs",
    "/tests/**/*.rs",
]

[dependencies]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "example_bench"
harness = false
